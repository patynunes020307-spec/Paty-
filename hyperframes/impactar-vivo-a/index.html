<!doctype html>
<html
  lang="pt-BR"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"e1","type":"string","label":"Etiqueta 1","default":"Assessoria e cerimonial"},
    {"id":"a1","type":"string","label":"Frase 1 — linha 1","default":"Para viver"},
    {"id":"b1","type":"string","label":"Frase 1 — itálico","default":"cada momento."},
    {"id":"e2","type":"string","label":"Etiqueta 2","default":"Planejamento cuidadoso"},
    {"id":"a2","type":"string","label":"Frase 2 — linha 1","default":"Presença"},
    {"id":"b2","type":"string","label":"Frase 2 — itálico","default":"em cada detalhe."},
    {"id":"e3","type":"string","label":"Etiqueta 3","default":"Impactar Cerimonial"},
    {"id":"a3","type":"string","label":"Frase 3 — linha 1","default":"12 anos,"},
    {"id":"b3","type":"string","label":"Frase 3 — itálico","default":"mais de 500 eventos."},
    {"id":"e4","type":"string","label":"Etiqueta 4","default":"Vai casar?"},
    {"id":"a4","type":"string","label":"Frase 4 — linha 1","default":"Chama a gente"},
    {"id":"b4","type":"string","label":"Frase 4 — itálico","default":"no direct."}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-600-italic.woff2") format("woff2"); font-weight: 600; font-style: italic; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      /* Guia de Publicações (Notion, 20/11/2026) */
      :root { --escuro: #072126; --nude: #e9cebb; --claro: #f7f2ef; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--escuro); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--escuro); }

      .cena { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
      .foto { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }

      /* Degradê petróleo escuro só na base da foto */
      #degrade {
        position: absolute; left: 0; bottom: 0; width: 1080px; height: 960px; z-index: 5;
        background: linear-gradient(0deg, rgba(7, 33, 38, 0.92) 0%, rgba(7, 33, 38, 0.7) 38%, rgba(7, 33, 38, 0) 100%);
      }

      #logo-wrap { position: absolute; left: 120px; top: 310px; width: 240px; z-index: 6; }
      #logo { width: 240px; height: auto; display: block; }

      /* Bloco de texto: esquerda, terço inferior */
      .bloco { position: absolute; left: 96px; top: 1120px; width: 800px; z-index: 7; }
      .fio { width: 96px; height: 3px; background: var(--nude); margin-bottom: 22px; transform-origin: 0 50%; }
      .etiqueta { font-family: "Montserrat", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--claro); margin-bottom: 14px; }
      .frase { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 88px; line-height: 1.02; color: var(--claro); }
      .frase em { display: block; font-style: italic; color: var(--nude); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <!-- Fotos (corte seco) -->
      <div id="c1" class="cena clip" data-start="0" data-duration="2.6" data-track-index="0"><img id="f1" class="foto" src="assets/img/01-convidados.jpg" alt="" /></div>
      <div id="c2" class="cena clip" data-start="2.6" data-duration="2.6" data-track-index="1"><img id="f2" class="foto" src="assets/img/02-noiva.jpg" alt="" /></div>
      <div id="c3" class="cena clip" data-start="5.2" data-duration="2.6" data-track-index="2"><img id="f3" class="foto" src="assets/img/03-decoracao.jpg" alt="" /></div>
      <div id="c4" class="cena clip" data-start="7.8" data-duration="2.6" data-track-index="3"><img id="f4" class="foto" src="assets/img/04-cerimonia.jpg" alt="" /></div>
      <div id="c5" class="cena clip" data-start="10.4" data-duration="2.6" data-track-index="4"><img id="f5" class="foto" src="assets/img/05-saida.jpg" alt="" /></div>
      <div id="c6" class="cena clip" data-start="13" data-duration="3" data-track-index="5"><img id="f6" class="foto" src="assets/img/06-fogos.jpg" alt="" /></div>

      <div id="degrade" class="clip" data-start="0" data-duration="16" data-track-index="6"></div>

      <!-- Logo original pequena na capa -->
      <div id="logo-wrap" class="clip" data-start="0" data-duration="2.6" data-track-index="7">
        <img id="logo" src="assets/img/logo-petroleo.png" alt="Impactar Cerimonial" />
      </div>

      <!-- Uma frase por vez -->
      <div id="t1" class="bloco clip" data-start="0" data-duration="4" data-track-index="8">
        <div class="fio" id="fio1"></div>
        <div class="etiqueta" data-var-text="e1">Assessoria e cerimonial</div>
        <div class="frase"><span data-var-text="a1">Para viver</span><em data-var-text="b1">cada momento.</em></div>
      </div>
      <div id="t2" class="bloco clip" data-start="4" data-duration="4" data-track-index="9">
        <div class="fio" id="fio2"></div>
        <div class="etiqueta" data-var-text="e2">Planejamento cuidadoso</div>
        <div class="frase"><span data-var-text="a2">Presença</span><em data-var-text="b2">em cada detalhe.</em></div>
      </div>
      <div id="t3" class="bloco clip" data-start="8" data-duration="4" data-track-index="10">
        <div class="fio" id="fio3"></div>
        <div class="etiqueta" data-var-text="e3">Impactar Cerimonial</div>
        <div class="frase"><span data-var-text="a3">12 anos,</span><em data-var-text="b3">mais de 500 eventos.</em></div>
      </div>
      <div id="t4" class="bloco clip" data-start="12" data-duration="4" data-track-index="11">
        <div class="fio" id="fio4"></div>
        <div class="etiqueta" data-var-text="e4">Vai casar?</div>
        <div class="frase"><span data-var-text="a4">Chama a gente</span><em data-var-text="b4">no direct.</em></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const suave = "power2.out";

      // Aproximação lenta e contínua, sempre no mesmo sentido
      [["#f1", 0, 2.6], ["#f2", 2.6, 2.6], ["#f3", 5.2, 2.6], ["#f4", 7.8, 2.6], ["#f5", 10.4, 2.6], ["#f6", 13, 3]].forEach(([f, s, d]) => {
        tl.fromTo(f, { scale: 1.0 }, { scale: 1.06, duration: d, ease: "none" }, s);
      });

      // Logo: só fade suave na saída da capa
      tl.to("#logo", { opacity: 0, duration: 0.3, ease: "power1.in" }, 2.3);

      // Frases: fade + subida curta (0,45 s), fio nude se desenhando, saída em fade 0,3 s
      [["#t1", "#fio1", 0], ["#t2", "#fio2", 4], ["#t3", "#fio3", 8], ["#t4", "#fio4", 12]].forEach(([t, fio, s], i) => {
        const entra = i === 0 ? s : s + 0.05;
        if (i === 0) {
          tl.fromTo(t, { y: 14 }, { y: 0, duration: 0.45, ease: suave }, entra);
        } else {
          tl.fromTo(t, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: suave }, entra);
        }
        tl.fromTo(fio, { scaleX: 0.15 }, { scaleX: 1, duration: 0.5, ease: suave }, entra + 0.1);
        if (i < 3) tl.to(t, { opacity: 0, duration: 0.3, ease: "power1.in" }, s + 3.65);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
