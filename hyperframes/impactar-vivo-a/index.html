<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-600-italic.woff2") format("woff2"); font-weight: 600; font-style: italic; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      :root { --petroleo: #203f51; --nude: #e9cebb; --branco: #fffaf6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--petroleo); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--petroleo); }

      .cena { position: absolute; inset: 0; overflow: hidden; }
      .foto { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      /* Faixa escura só para leitura do texto */
      .scrim { position: absolute; left: 0; width: 1080px; height: 1150px; }
      .scrim.topo { top: 0; background: linear-gradient(180deg, rgba(7, 33, 38, 0.85) 0%, rgba(7, 33, 38, 0.55) 45%, rgba(7, 33, 38, 0) 100%); }
      .scrim.base { bottom: 0; background: linear-gradient(0deg, rgba(7, 33, 38, 0.88) 0%, rgba(7, 33, 38, 0.6) 50%, rgba(7, 33, 38, 0) 100%); }

      .txt { position: absolute; left: 120px; width: 700px; color: var(--branco); }
      .serif { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 150px; line-height: 0.98; letter-spacing: -0.01em; }
      .serif em { font-style: italic; color: var(--nude); }
      .mask { overflow: hidden; padding-bottom: 14px; }
      .palavra { display: inline-block; }
      .sans { font-family: "Montserrat", sans-serif; font-weight: 600; font-size: 50px; line-height: 1.25; }
      .regua { width: 120px; height: 4px; background: var(--nude); margin-bottom: 26px; transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <!-- Cena 1 -->
      <div id="c1" class="cena clip" data-start="0" data-duration="2.15" data-track-index="0">
        <img id="f1" class="foto" src="assets/img/cerimonia.jpg" alt="" />
        <div class="scrim topo"></div>
        <div class="txt" style="top: 330px">
          <div class="mask"><span id="w1" class="serif palavra">Para</span></div>
          <div class="mask"><span id="w2" class="serif palavra">viver</span></div>
        </div>
      </div>

      <!-- Cena 2 -->
      <div id="c2" class="cena clip" data-start="2" data-duration="2.15" data-track-index="1">
        <img id="f2" class="foto" src="assets/img/lapela.jpg" alt="" />
        <div class="scrim base"></div>
        <div class="txt" style="top: 850px">
          <div class="mask"><span id="w3" class="serif palavra">cada</span></div>
          <div class="mask"><span id="w4" class="serif palavra"><em>momento.</em></span></div>
        </div>
      </div>

      <!-- Cena 3 -->
      <div id="c3" class="cena clip" data-start="4" data-duration="2" data-track-index="2">
        <img id="f3" class="foto" src="assets/img/noiva.jpg" alt="" />
        <div class="scrim topo"></div>
        <div class="txt" style="top: 360px">
          <div id="r3" class="regua"></div>
          <div class="mask"><span id="s1" class="sans palavra">Presença</span></div>
          <div class="mask"><span id="s2" class="sans palavra">em cada detalhe.</span></div>
        </div>
      </div>

      <!-- Um efeito por corte -->
      <audio id="sfx1" class="clip" src="assets/sfx/whoosh.wav" data-start="1.85" data-duration="0.6" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx2" class="clip" src="assets/sfx/whoosh.wav" data-start="3.85" data-duration="0.6" data-track-index="11" data-volume="0.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const out = "expo.out";

      // Cena 1: aproximação + palavras caindo uma a uma
      tl.fromTo("#f1", { scale: 1.0 }, { scale: 1.12, duration: 2.15, ease: "none" }, 0);
      tl.fromTo("#w1", { yPercent: 40 }, { yPercent: 0, duration: 0.7, ease: out }, 0);
      tl.fromTo("#w2", { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: out }, 0.35);

      // Corte 2: entra deslizando de baixo, câmera se afasta
      tl.fromTo("#c2", { yPercent: 100 }, { yPercent: 0, duration: 0.35, ease: "power3.out" }, 2.0);
      tl.fromTo("#f2", { scale: 1.18 }, { scale: 1.0, duration: 2.15, ease: "power1.out" }, 2.0);
      tl.fromTo("#w3", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: out }, 2.25);
      tl.fromTo("#w4", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: out }, 2.55);

      // Corte 3: entra pela direita, aproximação
      tl.fromTo("#c3", { xPercent: 100 }, { xPercent: 0, duration: 0.35, ease: "power3.out" }, 4.0);
      tl.fromTo("#f3", { scale: 1.0 }, { scale: 1.1, duration: 2.0, ease: "none" }, 4.0);
      tl.fromTo("#r3", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 4.25);
      tl.fromTo("#s1", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: out }, 4.35);
      tl.fromTo("#s2", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: out }, 4.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
