<style>
/* Layout: app de uma coluna no celular; no computador, formulário à esquerda e resultado fixo à direita. */
:root{--f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--f-num:'JetBrains Mono',ui-monospace,Menlo,monospace;--bg:#F4F5F7;--surface:#FFFFFF;--surface2:#F8F9FB;--field:#FFFFFF;--fg:#14171F;--muted:#5B6272;--line:#E1E4EA;--accent:#3B4BA8;--on-accent:#FFFFFF;--ring:rgba(59,75,168,.25);--chip:#ECEEF8;--good:#1E6B4A;--good-bg:#E2F1E8;--bad:#A3322B;--bad-bg:#F8E3E0;--warn:#8A5A00;--warn-bg:#FBF0D9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111318;--surface:#191C23;--surface2:#1E222B;--field:#15181E;--fg:#ECEEF2;--muted:#9AA1B0;--line:#2A2F3A;--accent:#9AA6F0;--on-accent:#111318;--ring:rgba(154,166,240,.3);--chip:#23283A;--good:#7FD3A6;--good-bg:#173327;--bad:#F2958C;--bad-bg:#3A1D1B;--warn:#F0C46A;--warn-bg:#33270F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111318;--surface:#191C23;--surface2:#1E222B;--field:#15181E;--fg:#ECEEF2;--muted:#9AA1B0;--line:#2A2F3A;--accent:#9AA6F0;--on-accent:#111318;--ring:rgba(154,166,240,.3);--chip:#23283A;--good:#7FD3A6;--good-bg:#173327;--bad:#F2958C;--bad-bg:#3A1D1B;--warn:#F0C46A;--warn-bg:#33270F;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

.verdict.bad{background:var(--bad-bg);color:var(--bad)}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;justify-content:space-between;align-items:center}

.list{display:flex;flex-direction:column;gap:10px}

.tbl-wrap{overflow-x:auto}

<header class="top"><div class="topin">
  <div class="brand"><div><b id="brandName"></b><small id="brandSub"></small></div><span class="status" id="status">Carregando…</span></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="barra" id="barra" hidden></div>

<script>
"use strict";
const MODE = "comercial";
const SEED = null;
const BRAND = {"nome":"Margem do Evento","sub":"Precificação para cerimonialistas"};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => n == null || !isFinite(n) ? "—" : n.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const pct = n => n == null || !isFinite(n) ? "—" : (n*100).toLocaleString("pt-BR", {maximumFractionDigits:1, minimumFractionDigits:1}) + "%";
const hrs = h => { if (h == null || !isFinite(h)) return "—"; const H = Math.floor(h + 1e-9), m = Math.round((h - H) * 60); return m ? `${H}h${String(m).padStart(2,"0")}` : `${H}h`; };
const num = v => v == null || v === "" ? null : Number(v);
const isNum = v => typeof v === "number" && isFinite(v);
function parseNum(s){
  s = String(s).trim().replace(/\s|R\$|%|h$/gi, "");
  if (s === "") return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}
const fmtIn = v => v == null || !isFinite(v) ? "" : String(Math.round(v * 100) / 100).replace(".", ",");
const r2 = n => Math.round(n * 100) / 100;

/* ---------- modelo ---------- */
function contaVazia(){
  return { versao: 1,
    empresa: { nome: "", despesas: null, proLabore: null, notaEstrutura: "", eventosAno: null,
      formas: [{ id: uid(), nome: "", taxa: null }], ajudas: [], meta: { tipo: "pct", valor: null },
      imposto: null, cnpjs: null, limiteAnual: null, tolerancia: null, mix: {} },
    pacotes: [] };
}
function pacoteVazio(nome){
  return { id: uid(), nome: nome || "Novo pacote", precoRef: null, duracaoMeses: null, nota: "",
    atividades: [], escala: [], despesas: [] };
}
const novaAtividade = () => ({ id: uid(), nome: "", qtd: null, duracao: null, prof: 1, rec: "unica" });
const novaEscala = () => ({ id: uid(), funcao: "", qtd: 1, rem: "hora", horas: null, valor: null, extra: 0, ajudas: [], nota: "" });
const novaDespesa = () => ({ id: uid(), nome: "", valor: null });

/* ---------- cálculo (mesma lógica nas duas versões) ---------- */
function calcPacote(pac, emp){
  const falta = [];
  const need = (v, lbl) => { if (!isNum(v)) falta.push(lbl); return isNum(v) ? v : 0; };
  const temMensal = pac.atividades.some(a => a.rec === "mensal");
  const meses = temMensal ? need(pac.duracaoMeses, "Pacote: duração do contrato (meses)") : (pac.duracaoMeses || 1);
  let horasPrep = 0;
  pac.atividades.forEach((a, i) => {
    const n = a.nome || `atividade ${i+1}`;
    const q = need(a.qtd, `Atividade "${n}": quantidade`), d = need(a.duracao, `Atividade "${n}": duração`), p = need(a.prof, `Atividade "${n}": profissionais`);
    horasPrep += q * d * p * (a.rec === "mensal" ? meses : 1);
  });
  let equipe = 0, ajudas = 0, horasDia = 0, pessoas = 0;
  const catAj = Object.fromEntries((emp.ajudas || []).map(a => [a.id, a]));
  pac.escala.forEach((e, i) => {
    const n = e.funcao || `linha ${i+1}`;
    const q = need(e.qtd, `Escala "${n}": quantidade de pessoas`);
    pessoas += q;
    if (e.rem === "hora") { const h = need(e.horas, `Escala "${n}": horas`), v = need(e.valor, `Escala "${n}": valor por hora`); equipe += q*h*v; horasDia += q*h; }
    else if (e.rem === "diaria") { equipe += q * need(e.valor, `Escala "${n}": valor da diária`); horasDia += q*(e.horas || 0); }
    else { equipe += q * (e.extra || 0); horasDia += q*(e.horas || 0); }
    (e.ajudas || []).forEach(id => { const a = catAj[id]; if (a) ajudas += q * need(a.valor, `Ajuda de custo "${a.nome || "sem nome"}": valor`); });
  });
  let despesas = 0;
  pac.despesas.forEach((d, i) => { despesas += need(d.valor, `Despesa "${d.nome || "linha " + (i+1)}": valor`); });
  return { horasPrep, equipe, ajudas, despesas, custoDireto: equipe + ajudas + despesas, horasDia, pessoas, falta, meses };
}
function calcEstrutura(emp){
  const falta = [], avisos = [];
  if (!isNum(emp.despesas)) falta.push("Empresa: despesas fixas mensais");
  if (!isNum(emp.proLabore)) falta.push("Empresa: pró-labore mensal");
  if (!isNum(emp.eventosAno)) falta.push("Empresa: eventos previstos por ano");
  const mensal = (emp.despesas || 0) + (emp.proLabore || 0);
  let rateio = null;
  if (isNum(emp.eventosAno) && emp.eventosAno <= 0) avisos.push("O número de eventos por ano está em zero. Sem eventos não há como dividir a estrutura: informe quantos eventos você prevê no ano.");
  else if (isNum(emp.eventosAno)) rateio = mensal * 12 / emp.eventosAno;
  return { mensal, rateio, falta, avisos };
}
function calcSim(sim, emp){
  const P = calcPacote(sim.pac, emp), E = calcEstrutura(emp);
  const falta = [...E.falta, ...P.falta], avisos = [...E.avisos];
  const forma = (emp.formas || []).find(f => f.id === sim.formaId) || (emp.formas || [])[0];
  if (!forma) falta.push("Empresa: forma de recebimento");
  else if (!isNum(forma.taxa)) falta.push(`Taxa de recebimento "${forma.nome || "sem nome"}"`);
  if (!isNum(emp.imposto)) falta.push("Empresa: imposto sobre a venda (use 0 se o imposto é fixo mensal)");
  if (!isNum(sim.preco)) falta.push("Simulação: preço que pretende cobrar");
  const meta = sim.meta;
  if (!isNum(meta.valor)) falta.push("Meta de sobra");
  const taxaForma = forma && isNum(forma.taxa) ? forma.taxa / 100 : 0;
  const imp = isNum(emp.imposto) ? emp.imposto / 100 : 0;
  const taxa = taxaForma + imp;
  const d = sim.desconto || { tipo: "reais", valor: 0 };
  const descV = !isNum(d.valor) ? 0 : d.tipo === "pct" ? (sim.preco || 0) * d.valor / 100 : d.valor;
  const preco = (sim.preco || 0) - descV;
  const base = P.custoDireto + (E.rateio || 0);
  const taxasVenda = preco * taxaForma, impostoV = preco * imp;
  const sobra = preco - taxasVenda - impostoV - base;
  const margem = preco > 0 ? sobra / preco : null;
  let precoMin = null, precoMeta = null, metaReais = null;
  if (taxa >= 1) avisos.push("Taxa de recebimento e imposto somam 100% ou mais da venda. Nenhum preço cobre os custos assim.");
  else precoMin = base / (1 - taxa);
  if (isNum(meta.valor)) {
    if (meta.tipo === "reais") { metaReais = meta.valor; if (taxa < 1) precoMeta = (base + meta.valor) / (1 - taxa); }
    else {
      const m = meta.valor / 100, div = 1 - taxa - m;
      metaReais = preco * m;
      if (div <= 0) avisos.push(`Taxa e imposto (${pct(taxa)}) somados à margem desejada de ${pct(m)} chega a 100% ou mais da venda. Nenhum preço atinge essa meta: reduza a margem desejada ou use outra forma de recebimento.`);
      else precoMeta = base / div;
    }
  }
  const ok = falta.length === 0 && E.rateio != null;
  return { ...P, rateio: E.rateio, mensal: E.mensal, taxa, taxaForma, imp, impostoV, taxasVenda, descV, preco, sobra, margem, precoMin, precoMeta, metaReais, folga: metaReais == null ? null : sobra - metaReais, falta, avisos, ok, forma };
}

function calcLimite(emp, pacotes){
  if (!isNum(emp.cnpjs) || !isNum(emp.limiteAnual) || emp.cnpjs <= 0 || emp.limiteAnual <= 0) return null;
  const cap = emp.cnpjs * emp.limiteAnual, tol = isNum(emp.tolerancia) ? emp.tolerancia : 0, teto = cap * (1 + tol / 100);
  const mix = emp.mix || {};
  let fat = 0, n = 0;
  pacotes.forEach(p => { const q = mix[p.id] || 0; n += q; fat += q * (p.precoRef || 0); });
  const status = n === 0 ? null : fat <= cap ? "ok" : fat <= teto ? "faixa" : "acima";
  return { cap, tol, teto, fat, n, status, precoMedioMax: isNum(emp.eventosAno) && emp.eventosAno > 0 ? cap / emp.eventosAno : null };
}

/* ---------- estado ---------- */
const S = { conta: null, sim: null, sims: [], view: "simular", pacIdx: 0, confirm: null, store: null, uid: null, local: false };
function novaSim(pac){
  const e = S.conta.empresa;
  return { id: null, nome: "", pacoteId: pac ? pac.id : null, pacoteNome: pac ? pac.nome : "", pac: pac ? clone(pac) : pacoteVazio(""),
    preco: pac ? pac.precoRef : null, desconto: { tipo: "reais", valor: 0 }, formaId: (e.formas[0] || {}).id || null, meta: clone(e.meta) };
}

/* ---------- armazenamento ---------- */
function setStatus(t, cls){ const el = $("#status"); el.textContent = t; el.className = "status" + (cls ? " " + cls : ""); }
const LKEY = () => `prec-${MODE}-${S.uid || "local"}`;
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);

async function initStore(){
  let db = null, user = null;
  try { if (window.claude && claude.use) { [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); } } catch {}
  if (db) {
    try {
      let conta;
      if (MODE === "comercial") {
        S.uid = user ? await user.id() : null;
        if (S.uid) conta = db.doc(`data/users/${S.uid}/conta`);
      } else conta = db.doc("ws/conta");
      if (conta) { S.store = { conta, sims: conta.collection("sims") }; }
    } catch (e) { S.store = null; }
  }
  if (S.store) {
    try {
      const [c, q] = await withTimeout(Promise.all([S.store.conta.get(), S.store.sims.get()]), 12000);
      S.conta = c.exists ? c.data().conta : null;
      S.sims = q.docs.map(d => d.data()).filter(Boolean);
      S.conta = S.conta ? clone(S.conta) : (SEED ? clone(SEED) : contaVazia());
      S.sims = clone(S.sims);
      setStatus("Salvo na conta", "ok");
    } catch (e) { S.store = null; }
  }
  if (!S.store) {
    S.local = true;
    const l = lsGet(LKEY());
    S.conta = l && l.conta ? l.conta : (SEED ? clone(SEED) : contaVazia());
    S.sims = l && l.sims ? l.sims : [];
    setStatus("Só neste aparelho");
  }
  // Contas criadas antes dos campos de imposto e limite recebem os valores iniciais.
  const emp = S.conta.empresa, base = SEED ? SEED.empresa : contaVazia().empresa;
  ["imposto", "cnpjs", "limiteAnual", "tolerancia", "mix"].forEach(k => { if (!(k in emp)) emp[k] = clone(base[k]); });
  const rascunho = lsGet(LKEY() + "-rascunho");
  S.sim = rascunho && rascunho.pac ? rascunho : novaSim(S.conta.pacotes[0]);
}
let saveTimer = null, saving = Promise.resolve();
function saveConta(){
  clearTimeout(saveTimer);
  setStatus("Salvando…");
  saveTimer = setTimeout(() => {
    const body = { conta: clone(S.conta), atualizadoEm: new Date().toISOString() };
    saving = saving.then(async () => {
      if (S.local) { lsSet(LKEY(), { conta: S.conta, sims: S.sims }); setStatus("Só neste aparelho"); return; }
      try { await S.store.conta.set(body); setStatus("Salvo na conta", "ok"); }
      catch (e) { setStatus("Não salvou", "err"); }
    });
  }, 700);
}
async function saveSimDoc(sim){
  if (S.local) { lsSet(LKEY(), { conta: S.conta, sims: S.sims }); return true; }
  try { setStatus("Salvando…"); await S.store.sims.doc(sim.id).set(clone(sim)); setStatus("Salvo na conta", "ok"); return true; }
  catch { setStatus("Não salvou", "err"); return false; }
}
async function deleteSimDoc(id){
  if (S.local) { lsSet(LKEY(), { conta: S.conta, sims: S.sims }); return; }
  try { await S.store.sims.doc(id).delete(); } catch { setStatus("Não excluiu", "err"); }
}
let draftTimer = null;
const saveDraft = () => { clearTimeout(draftTimer); draftTimer = setTimeout(() => lsSet(LKEY() + "-rascunho", S.sim), 400); };

/* ---------- caminhos ---------- */
const getP = p => p.split(".").reduce((o, k) => o == null ? o : o[k], S);
function setP(p, v){ const ks = p.split("."); let o = S; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }

/* ---------- componentes ---------- */
function fNum(label, path, o = {}){
  const v = getP(path);
  const empty = o.req && !isNum(v);
  return `<label class="f">${esc(label)}${o.hint ? ` <span class="hint">${esc(o.hint)}</span>` : ""}
    <span class="inp${o.req ? " req" : ""}${empty ? " empty" : ""}">${o.pre ? `<span>${o.pre}</span>` : ""}<input type="text" inputmode="decimal" autocomplete="off" data-k="${path}" data-t="num"${o.req ? " data-req" : ""} value="${esc(fmtIn(v))}" placeholder="${o.req ? "preencher" : "0"}">${o.suf ? `<span>${o.suf}</span>` : ""}</span></label>`;
}
function fTxt(label, path, ph = ""){
  return `<label class="f">${esc(label)}<span class="inp"><input type="text" autocomplete="off" data-k="${path}" data-t="text" value="${esc(getP(path))}" placeholder="${esc(ph)}"></span></label>`;
}
function fSel(label, path, opts, o = {}){
  const v = getP(path);
  return `<label class="f">${esc(label)}<span class="inp sel"><select data-k="${path}" data-t="${o.t || "text"}">${opts.map(([val, t]) => `<option value="${esc(val)}"${String(val) === String(v) ? " selected" : ""}>${esc(t)}</option>`).join("")}</select></span></label>`;
}

function editorPacote(pp, pac, opts = {}){
  const emp = S.conta.empresa;
  const C = calcPacote(pac, emp);
  const ats = pac.atividades.map((a, i) => {
    const p = `${pp}.atividades.${i}`;
    const h = (a.qtd || 0) * (a.duracao || 0) * (a.prof || 0) * (a.rec === "mensal" ? (pac.duracaoMeses || 0) : 1);
    return `<div class="item"><div class="head"><span class="sub" data-out="at-${a.id}">${hrs(h)} de trabalho</span>${btnDel(p, "atividade")}</div>
      ${fTxt("Atividade", p + ".nome", "Reunião, visita, cotação…")}
      <div class="row">${fNum("Quantidade", p + ".qtd", { req: 1, suf: a.rec === "mensal" ? "por mês" : "vezes" })}${fNum("Duração", p + ".duracao", { req: 1, suf: "h" })}${fNum("Profissionais", p + ".prof", { req: 1, suf: "pessoas" })}
      ${fSel("Frequência", p + ".rec", [["unica", "Ocorre no total"], ["mensal", "Repete todo mês"]])}</div></div>`;
  }).join("");
  const esc_ = pac.escala.map((e, i) => {
    const p = `${pp}.escala.${i}`;
    const aj = (emp.ajudas || []).map(a => { const on = (e.ajudas || []).includes(a.id); return `<label class="chk${on ? " on" : ""}"><input type="checkbox" data-k="${p}.ajudas" data-t="ajuda" data-id="${a.id}"${on ? " checked" : ""}>${esc(a.nome || "Ajuda")} · ${brl(a.valor)}</label>`; }).join("");
    let campos;
    if (e.rem === "hora") campos = fNum("Horas no evento", p + ".horas", { req: 1, suf: "h" }) + fNum("Valor por hora", p + ".valor", { req: 1, pre: "R$" });
    else if (e.rem === "diaria") campos = fNum("Horas no evento", p + ".horas", { suf: "h", hint: "opcional" }) + fNum("Diária por pessoa", p + ".valor", { req: 1, pre: "R$" });
    else campos = fNum("Horas no evento", p + ".horas", { suf: "h", hint: "para medir dedicação" }) + fNum("Pagamento extra", p + ".extra", { pre: "R$", hint: "só se houver" });
    return `<div class="item"><div class="head"><span class="sub" data-out="es-${e.id}"></span>${btnDel(p, "linha da escala")}</div>
      <div class="row">${fTxt("Função", p + ".funcao", "Assistente, coordenação…")}${fNum("Pessoas", p + ".qtd", { req: 1 })}
      ${fSel("Remuneração", p + ".rem", [["hora", "Valor por hora"], ["diaria", "Diária fixa"], ["prolabore", "Pró-labore (já na estrutura)"]])}</div>
      <div class="row">${campos}</div>
      ${aj ? `<div><div class="note" style="margin:0 0 6px">Ajudas de custo por pessoa nesta linha</div><div class="chips">${aj}</div></div>` : ""}
      ${e.nota ? `<div class="note">${esc(e.nota)}</div>` : ""}</div>`;
  }).join("");
  const desp = pac.despesas.map((d, i) => {
    const p = `${pp}.despesas.${i}`;
    return `<div class="item"><div class="head"><span></span>${btnDel(p, "despesa")}</div><div class="row">${fTxt("Despesa", p + ".nome", "Transporte, impressos, materiais…")}${fNum("Valor", p + ".valor", { req: 1, pre: "R$" })}</div></div>`;
  }).join("");
  return `<div class="stack">
    ${opts.cabecalho ? `<div class="card stack">${opts.cabecalho}</div>` : ""}
    <div class="card stack"><div class="sec-t"><h3>Atividades de preparação</h3><span class="tot" data-out="tot-prep">${hrs(C.horasPrep)}</span></div>
      <p class="note" style="margin:0">Horas = quantidade × duração × profissionais presentes${pac.atividades.some(a => a.rec === "mensal") ? " × meses de contrato (atividades mensais)" : ""}.</p>
      ${ats || `<p class="empty-s">Nenhuma atividade ainda.</p>`}
      <div class="actions"><button class="b sm" data-act="add" data-path="${pp}.atividades" data-kind="atividade">+ Atividade</button></div></div>
    <div class="card stack"><div class="sec-t"><h3>Escala do dia</h3><span class="tot" data-out="tot-esc">${brl(C.equipe + C.ajudas)}</span></div>
      ${esc_ || `<p class="empty-s">Nenhuma pessoa na escala ainda.</p>`}
      <div class="actions"><button class="b sm" data-act="add" data-path="${pp}.escala" data-kind="escala">+ Função na escala</button></div></div>
    <div class="card stack"><div class="sec-t"><h3>Despesas do evento</h3><span class="tot" data-out="tot-desp">${brl(C.despesas)}</span></div>
      ${desp || `<p class="empty-s">Nenhuma despesa ainda. Zero também é um valor válido.</p>`}
      <div class="actions"><button class="b sm" data-act="add" data-path="${pp}.despesas" data-kind="despesa">+ Despesa</button></div></div>
  </div>`;
}
function btnDel(path, what){
  if (S.confirm === path) return `<span class="actions"><button class="b sm danger" data-act="del" data-path="${path}">Excluir ${what}</button><button class="b sm ghost" data-act="cancel">Manter</button></span>`;
  return `<button class="b sm ghost" data-act="ask" data-path="${path}" aria-label="Excluir ${what}">Excluir</button>`;
}

/* ---------- views ---------- */
const TABS = [["simular", "Simular"], ["pacotes", "Pacotes"], ["empresa", "Empresa"], ["salvas", "Salvas"]];
function renderTabs(){ $("#tabs").innerHTML = TABS.map(([k, t]) => `<button data-act="tab" data-v="${k}" aria-current="${S.view === k}">${t}${k === "salvas" && S.sims.length ? ` (${S.sims.length})` : ""}</button>`).join(""); }

function render(){
  renderTabs();
  const v = S.view;
  let h = "";
  if (S.local) h += `<div class="banner">${MODE === "comercial" ? "Você não está conectada a uma conta. Os dados ficam só neste navegador. Entre com sua conta para salvar e reabrir em qualquer aparelho." : "Sem conexão com a conta: os dados ficam só neste aparelho até a conexão voltar."}</div>`;
  if (v === "simular") h += viewSimular();
  else if (v === "pacotes") h += viewPacotes();
  else if (v === "empresa") h += viewEmpresa();
  else h += viewSalvas();
  $("#app").innerHTML = h;
  $("#barra").hidden = v !== "simular" || !S.sim.pacoteId;
  recalc();
}

function onboarding(){

    <div class="steps"><div class="step${empOk ? " done" : ""}"><i>${empOk ? "✓" : "1"}</i>Configure a empresa: estrutura mensal, eventos por ano, taxas e meta</div>
    <div class="step${pacOk ? " done" : ""}"><i>${pacOk ? "✓" : "2"}</i>Crie um pacote com atividades, escala e despesas</div>
    <div class="step"><i>3</i>Simule o preço de um evento</div></div>
    <div class="actions" style="margin-top:14px">${!empOk ? `<button class="b pri" data-act="tab" data-v="empresa">Configurar empresa</button>` : ""}${!pacOk ? `<button class="b${empOk ? " pri" : ""}" data-act="newpac">Criar pacote</button>` : ""}</div></div>`;
}

function viewSimular(){
  const pacs = S.conta.pacotes;

  const formas = e.formas.map(f => [f.id, `${f.nome || "Sem nome"} · ${isNum(f.taxa) ? f.taxa.toString().replace(".", ",") + "%" : "taxa a preencher"}`]);
  const cab = `<div class="sec-t"><h2>${s.id ? "Simulação salva" : "Nova simulação"}</h2><button class="b sm ghost" data-act="resetsim">Começar outra</button></div>
    ${fTxt("Nome da simulação", "sim.nome", "Ex.: cliente e data do evento")}
    <div class="row">${fSel("Pacote", "sim.pacoteId", pacs.map(p => [p.id, p.nome || "Sem nome"]), { t: "pac" })}${fNum("Preço que pretende cobrar", "sim.preco", { req: 1, pre: "R$" })}</div>
    <div class="row">${fSel("Desconto em", "sim.desconto.tipo", [["reais", "Reais"], ["pct", "Percentual"]])}${fNum("Desconto", "sim.desconto.valor", s.desconto.tipo === "pct" ? { suf: "%" } : { pre: "R$" })}
      ${fSel("Forma de recebimento", "sim.formaId", formas)}</div>
    <div class="row">${fSel("Meta em", "sim.meta.tipo", [["reais", "Reais por evento"], ["pct", "Percentual sobre a venda"]])}${fNum("Meta de sobra", "sim.meta.valor", s.meta.tipo === "pct" ? { req: 1, suf: "%" } : { req: 1, pre: "R$" })}</div>
    <p class="note" style="margin:0">Baseada no pacote "${esc(s.pacoteNome)}". As mudanças abaixo valem só para esta simulação; o pacote original não é alterado.</p>
    <div class="actions"><button class="b pri" data-act="savesim">${s.id ? "Salvar alterações" : "Salvar simulação"}</button>${s.id ? `<button class="b" data-act="saveasnew">Salvar como nova</button>` : ""}<span class="note" id="savemsg" style="margin:0"></span></div>`;
  return `<div class="grid sim"><div class="stack"><div class="card stack">${cab}</div>
    <details class="card adj" ${S.ui_adj ? "open" : ""} id="adj"><summary>Ajustar este evento: atividades, escala e despesas</summary><div style="margin-top:14px">${editorPacote("sim.pac", s.pac)}</div></details></div>
    <aside class="res"><div class="card" id="resultado"></div></aside></div>`;

function pickPac(){
  return `<p class="lead">Escolha o pacote para começar.</p><div class="list">${S.conta.pacotes.map(p => `<button class="b" style="text-align:left" data-act="pick" data-id="${p.id}">${esc(p.nome || "Sem nome")} <span class="meta num" style="color:var(--muted);font-weight:500">· ${brl(p.precoRef)}</span></button>`).join("")}</div>`;
}

function resultadoHTML(R, s){
  if (R.falta.length || R.rateio == null) {
    return `<h3>Resultado</h3>${R.avisos.map(a => `<div class="verdict warn">${esc(a)}</div>`).join("")}${R.falta.length ? `<div class="miss"><b>Preencha para calcular:</b><ul>${R.falta.slice(0, 8).map(f => `<li>${esc(f)}</li>`).join("")}${R.falta.length > 8 ? `<li>e mais ${R.falta.length - 8}</li>` : ""}</ul></div>` : ""}`;
  }
  const good = R.sobra >= 0;
  let verdict = "";
  if (R.folga != null) verdict = R.folga >= 0
    ? `<div class="verdict good">Meta atingida. Ainda pode gastar ${brl(R.folga)} neste evento sem perder a meta.</div>`
    : `<div class="verdict bad">Faltam ${brl(-R.folga)} para a meta.${R.precoMeta != null ? ` Para atingi-la, cobre ${brl(R.precoMeta)}.` : ""}</div>`;
  const metaTxt = s.meta.tipo === "pct" ? `${String(s.meta.valor).replace(".", ",")}% da venda (${brl(R.metaReais)})` : brl(R.metaReais);
  return `<h3>Resultado</h3>
    ${R.avisos.map(a => `<div class="verdict warn">${esc(a)}</div>`).join("")}
    <div class="big"><div class="kpi ${good ? "good" : "bad"}"><div class="k">Sobra estimada</div><div class="v">${brl(R.sobra)}</div></div>
    <div class="kpi ${good ? "good" : "bad"}"><div class="k">Margem</div><div class="v">${pct(R.margem)}</div></div></div>
    ${verdict}
    <div class="ln"><span class="l">Preço cobrado${R.descV ? `<small>${brl(s.preco)} − desconto ${brl(R.descV)}</small>` : ""}</span><span class="v">${brl(R.preco)}</span></div>
    <div class="ln"><span class="l">− Taxa de recebimento<small>${esc(R.forma ? R.forma.nome || "" : "")} ${pct(R.taxaForma)}</small></span><span class="v">${brl(R.taxasVenda)}</span></div>
    ${R.imp ? `<div class="ln"><span class="l">− Imposto sobre a venda<small>${pct(R.imp)}</small></span><span class="v">${brl(R.impostoV)}</span></div>` : ""}
    <div class="ln"><span class="l">− Custo do evento<small>Equipe ${brl(R.equipe)} · ajudas ${brl(R.ajudas)} · despesas ${brl(R.despesas)}</small></span><span class="v">${brl(R.custoDireto)}</span></div>
    <div class="ln"><span class="l">− Parcela da estrutura<small>Média: ${brl(R.mensal)} × 12 ÷ ${S.conta.empresa.eventosAno} eventos</small></span><span class="v">${brl(R.rateio)}</span></div>
    <div class="ln"><span class="l"><b style="color:var(--fg)">= Sobra estimada</b></span><span class="v">${brl(R.sobra)}</span></div>
    <div style="height:10px"></div>
    <div class="ln"><span class="l">Preço mínimo<small>Cobre custos e estrutura, sobra zero</small></span><span class="v">${brl(R.precoMin)}</span></div>
    <div class="ln"><span class="l">Preço para a meta<small>Meta: ${metaTxt}</small></span><span class="v">${brl(R.precoMeta)}</span></div>
    <div style="height:10px"></div>
    <div class="ln"><span class="l">Horas de preparação</span><span class="v">${hrs(R.horasPrep)}</span></div>
    <div class="ln"><span class="l">Sobra por hora de preparação</span><span class="v">${R.horasPrep > 0 ? brl(R.sobra / R.horasPrep) : "—"}</span></div>
    <div class="ln"><span class="l">Pessoas na escala · horas no dia</span><span class="v">${R.pessoas} · ${hrs(R.horasDia)}</span></div>
    ${(() => { const L = calcLimite(S.conta.empresa, S.conta.pacotes); if (!L || !isNum(S.conta.empresa.eventosAno)) return "";
      const ano = R.preco * S.conta.empresa.eventosAno, cor = ano <= L.cap ? "good" : ano <= L.teto ? "warn" : "bad";
      return `<div style="height:10px"></div><div class="verdict ${cor}" style="font-weight:500">Se os ${S.conta.empresa.eventosAno} eventos do ano fossem a este preço: ${brl(ano)} de faturamento. Limite: ${brl(L.cap)}${L.tol ? ` (${brl(L.teto)} com a tolerância de ${L.tol}%)` : ""}.</div>`; })()}
    <p class="note">A parcela da estrutura é uma média anual por evento. Pró-labore entra só na estrutura; na escala conta apenas pagamento extra.</p>`;
}

function viewPacotes(){
  const pacs = S.conta.pacotes, e = S.conta.empresa;
  if (!pacs.length) return `<div class="grid">${onboarding()}</div>`;
  if (S.pacIdx >= pacs.length) S.pacIdx = 0;

  const forma = e.formas[0];
  const rows = pacs.map((p, i) => {
    const s = { pac: p, preco: p.precoRef, desconto: { tipo: "reais", valor: 0 }, formaId: forma && forma.id, meta: e.meta };
    const R = calcSim(s, e);
    const ok = !R.falta.length && R.rateio != null;
    return `<tr><td><button class="b sm ghost" data-act="selpac" data-i="${i}" style="padding:0">${esc(p.nome || "Sem nome")}</button></td><td>${hrs(R.horasPrep)}</td><td>${R.pessoas}</td><td>${brl(R.custoDireto)}</td><td>${brl(p.precoRef)}</td><td>${ok ? brl(R.sobra) : "—"}</td><td>${ok ? pct(R.margem) : "—"}</td><td>${ok ? brl(R.precoMeta) : "—"}</td></tr>`;
  }).join("");
  const p = pacs[S.pacIdx], pp = `conta.pacotes.${S.pacIdx}`;
  const cab = `<div class="sec-t"><h2>${esc(p.nome || "Sem nome")}</h2><div class="actions"><button class="b sm" data-act="duppac">Duplicar</button>${S.confirm === "pac:" + p.id ? `<button class="b sm danger" data-act="delpac">Excluir pacote</button><button class="b sm ghost" data-act="cancel">Manter</button>` : `<button class="b sm ghost" data-act="ask" data-path="pac:${p.id}">Excluir</button>`}</div></div>
    <div class="row">${fTxt("Nome do pacote", pp + ".nome", "Nome que você usa com o cliente")}${fNum("Preço de referência", pp + ".precoRef", { pre: "R$" })}${fNum("Duração do contrato", pp + ".duracaoMeses", { suf: "meses", hint: "obrigatória se houver atividade mensal" })}</div>
    ${p.nota ? `<p class="note" style="margin:0">${esc(p.nota)}</p>` : ""}
    <div class="actions"><button class="b pri" data-act="simpac">Simular este pacote</button></div>`;
  return `<div class="grid"><div class="card stack"><div class="sec-t"><h2>Seus pacotes</h2><button class="b sm" data-act="newpac">+ Novo pacote</button></div>
    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>Pacote</th><th>Preparação</th><th>Pessoas</th><th>Custo do evento</th><th>Preço ref.</th><th>Sobra</th><th>Margem</th><th>Preço p/ meta</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note" style="margin:0">Comparação no preço de referência, com ${forma ? esc(forma.nome || "a primeira forma de recebimento") : "—"} e a meta padrão da empresa.${E.rateio != null ? ` Parcela da estrutura: ${brl(E.rateio)} por evento.` : ""}</p></div>
    <div class="chips">${pacs.map((x, i) => `<button class="chk${i === S.pacIdx ? " on" : ""}" data-act="selpac" data-i="${i}">${esc(x.nome || "Sem nome")}</button>`).join("")}</div>
    ${editorPacote(pp, p, { cabecalho: cab })}</div>`;
}

function viewEmpresa(){
  const e = S.conta.empresa, E = calcEstrutura(e);
  const formas = e.formas.map((f, i) => `<div class="item"><div class="head"><span></span>${e.formas.length > 1 ? btnDel(`conta.empresa.formas.${i}`, "forma") : ""}</div><div class="row">${fTxt("Forma de recebimento", `conta.empresa.formas.${i}.nome`, "Pix, cartão, boleto…")}${fNum("Taxa", `conta.empresa.formas.${i}.taxa`, { req: 1, suf: "%" })}</div></div>`).join("");
  const ajudas = e.ajudas.map((a, i) => `<div class="item"><div class="head"><span></span>${btnDel(`conta.empresa.ajudas.${i}`, "ajuda")}</div><div class="row">${fTxt("Ajuda de custo", `conta.empresa.ajudas.${i}.nome`, "Alimentação, deslocamento…")}${fNum("Valor por pessoa", `conta.empresa.ajudas.${i}.valor`, { req: 1, pre: "R$" })}</div></div>`).join("");
  return `<div class="grid"><div class="card stack"><h2>Empresa</h2>${fTxt("Nome da empresa", "conta.empresa.nome", "Como aparece para você")}</div>
    <div class="card stack"><div class="sec-t"><h3>Estrutura mensal</h3><span class="tot" data-out="estr">${brl(E.mensal)} / mês</span></div>
      <div class="row">${fNum("Despesas fixas mensais", "conta.empresa.despesas", { req: 1, pre: "R$" })}${fNum("Pró-labore mensal", "conta.empresa.proLabore", { req: 1, pre: "R$", hint: "use 0 se já estiver nas despesas" })}${fNum("Eventos previstos por ano", "conta.empresa.eventosAno", { req: 1, suf: "eventos" })}</div>
      ${e.notaEstrutura ? `<p class="note" style="margin:0">${esc(e.notaEstrutura)}</p>` : ""}
      <div class="ln"><span class="l">Parcela média por evento<small>Estrutura mensal × 12 ÷ eventos por ano</small></span><span class="v" data-out="rateio">${brl(E.rateio)}</span></div>
      ${E.avisos.map(a => `<div class="verdict warn">${esc(a)}</div>`).join("")}</div>
    <div class="card stack"><h3>Taxas de recebimento</h3><p class="note" style="margin:0">Percentual descontado da venda. Zero é válido.</p>${formas}<div class="actions"><button class="b sm" data-act="add" data-path="conta.empresa.formas" data-kind="forma">+ Forma de recebimento</button></div></div>
    <div class="card stack"><h3>Imposto sobre a venda</h3><div class="row">${fNum("Imposto sobre cada venda", "conta.empresa.imposto", { req: 1, suf: "%", hint: "0 se o imposto é fixo mensal e já está na estrutura" })}</div></div>
    ${limiteCard()}
    <div class="card stack"><h3>Ajudas de custo</h3><p class="note" style="margin:0">Cadastre aqui e marque por pessoa na escala de cada pacote ou simulação.</p>${ajudas || `<p class="empty-s">Nenhuma ajuda cadastrada.</p>`}<div class="actions"><button class="b sm" data-act="add" data-path="conta.empresa.ajudas" data-kind="ajuda">+ Ajuda de custo</button></div></div>
    <div class="card stack"><h3>Meta padrão de sobra</h3><div class="row">${fSel("Meta em", "conta.empresa.meta.tipo", [["reais", "Reais por evento"], ["pct", "Percentual sobre a venda"]])}${fNum("Meta", "conta.empresa.meta.valor", e.meta.tipo === "pct" ? { req: 1, suf: "%" } : { req: 1, pre: "R$" })}</div><p class="note" style="margin:0">Cada simulação começa com esta meta e pode alterá-la.</p></div>
    ${SEED ? `<div class="card stack"><h3>Cenário original</h3><p class="note" style="margin:0">Restaura empresa e pacotes para os valores iniciais. Simulações salvas não são afetadas.</p><div class="actions">${S.confirm === "seed" ? `<button class="b danger" data-act="seed">Restaurar agora</button><button class="b ghost" data-act="cancel">Cancelar</button>` : `<button class="b" data-act="ask" data-path="seed">Restaurar cenário original</button>`}</div></div>` : ""}
  </div>`;
}

function limiteCard(){
  const e = S.conta.empresa;
  const mix = S.conta.pacotes.map(p => `<label class="f">${esc(p.nome || "Sem nome")} <span class="hint">${brl(p.precoRef)}</span><span class="inp"><input type="text" inputmode="decimal" autocomplete="off" data-k="conta.empresa.mix.${p.id}" data-t="num" value="${esc(fmtIn((e.mix || {})[p.id]))}" placeholder="0"><span>eventos</span></span></label>`).join("");
  return `<div class="card stack"><div class="sec-t"><h3>Limite de faturamento</h3></div>
    <p class="note" style="margin:0">Opcional. Preencha se o seu enquadramento tem teto de faturamento anual.</p>
    <div class="row">${fNum("CNPJs que emitem nota", "conta.empresa.cnpjs", {})}${fNum("Limite anual por CNPJ", "conta.empresa.limiteAnual", { pre: "R$" })}${fNum("Tolerância", "conta.empresa.tolerancia", { suf: "%", hint: "antes do desenquadramento" })}</div>
    ${mix ? `<div><div class="note" style="margin:0 0 6px">Quantos eventos de cada pacote você espera fechar no ano</div><div class="row">${mix}</div></div>` : ""}
    <div id="limiteOut"></div></div>`;
}
function limiteOutHTML(){
  const e = S.conta.empresa, L = calcLimite(e, S.conta.pacotes);
  if (!L) return "";
  let h = `<div class="ln"><span class="l">Limite somado<small>${e.cnpjs} × ${brl(e.limiteAnual)}, supondo faturamento bem dividido entre os CNPJs</small></span><span class="v">${brl(L.cap)}</span></div>`;
  if (L.precoMedioMax != null) h += `<div class="ln"><span class="l">Preço médio máximo por evento<small>Limite ÷ ${e.eventosAno} eventos previstos</small></span><span class="v">${brl(L.precoMedioMax)}</span></div>`;
  if (L.status) {
    h += `<div class="ln"><span class="l">Faturamento previsto<small>${L.n} eventos no preço de referência</small></span><span class="v">${brl(L.fat)}</span></div>`;
    const msg = L.status === "ok" ? ["good", `Dentro do limite. Sobram ${brl(L.cap - L.fat)} de folga no ano.`]
      : L.status === "faixa" ? ["warn", `Passa o limite em ${brl(L.fat - L.cap)}, dentro da tolerância de ${L.tol}%. O excesso paga imposto complementar. Confirme com a contabilidade.`]
      : ["bad", `Passa o limite em ${brl(L.fat - L.cap)}, acima da tolerância de ${L.tol}%. Risco de desenquadramento e imposto sobre o faturamento do ano. Fale com a contabilidade antes de fechar esses contratos.`];
    h += `<div class="verdict ${msg[0]}">${msg[1]}</div>`;
    if (isNum(e.eventosAno) && L.n !== e.eventosAno) h += `<p class="note" style="margin:0">A soma dos eventos por pacote (${L.n}) é diferente dos ${e.eventosAno} eventos usados no rateio da estrutura.</p>`;
  }
  return h;
}

function viewSalvas(){
  const e = S.conta.empresa;
  const list = [...S.sims].sort((a, b) => (b.atualizadoEm || "").localeCompare(a.atualizadoEm || ""));
  return `<div class="grid"><div class="card stack"><h2>Simulações salvas</h2>${list.length ? `<div class="list">${list.map(s => {
    const R = calcSim(s, e);
    const dt = s.atualizadoEm ? new Date(s.atualizadoEm).toLocaleDateString("pt-BR") : "";
    return `<div class="item"><div class="li"><div><b>${esc(s.nome || "Sem nome")}</b><div class="meta">${esc(s.pacoteNome)} · ${brl(s.preco)} · ${dt}</div><div class="meta num">Sobra hoje: ${R.ok ? `${brl(R.sobra)} (${pct(R.margem)})` : "dados incompletos"}</div></div>
      <div class="actions"><button class="b sm pri" data-act="opensim" data-id="${s.id}">Abrir</button><button class="b sm" data-act="dupsim" data-id="${s.id}">Duplicar</button>${S.confirm === "sim:" + s.id ? `<button class="b sm danger" data-act="delsim" data-id="${s.id}">Excluir</button><button class="b sm ghost" data-act="cancel">Manter</button>` : `<button class="b sm ghost" data-act="ask" data-path="sim:${s.id}">Excluir</button>`}</div></div></div>`;
  }).join("")}</div><p class="note">A sobra é recalculada com a estrutura e as taxas atuais da empresa.</p>` : `<p class="empty-s">Nenhuma simulação salva. Na aba Simular, monte um evento e toque em Salvar simulação.</p>`}</div></div>`;
}

/* ---------- recálculo sem redesenhar os campos ---------- */
function recalc(){
  const e = S.conta.empresa;
  if (S.view === "simular" && S.sim.pacoteId && $("#resultado")) {
    const R = calcSim(S.sim, e);
    $("#resultado").innerHTML = resultadoHTML(R, S.sim);
    updOuts(S.sim.pac, calcPacote(S.sim.pac, e));
    const b = $("#barra");
    b.innerHTML = R.falta.length || R.rateio == null ? `<div><div class="k">Resultado</div><div class="v" style="font-size:14px;color:var(--warn)">Preencha os campos em destaque</div></div>`
      : `<div><div class="k">Sobra</div><div class="v" style="color:var(${R.sobra >= 0 ? "--good" : "--bad"})">${brl(R.sobra)}</div></div><div><div class="k">Margem</div><div class="v">${pct(R.margem)}</div></div><div><div class="k">Preço p/ meta</div><div class="v">${brl(R.precoMeta)}</div></div>`;
  }
  if (S.view === "pacotes" && S.conta.pacotes[S.pacIdx]) { const p = S.conta.pacotes[S.pacIdx]; updOuts(p, calcPacote(p, e)); }
  if (S.view === "empresa") { const lo = $("#limiteOut"); if (lo) lo.innerHTML = limiteOutHTML(); const E = calcEstrutura(e); const a = document.querySelector('[data-out="estr"]'); if (a) a.textContent = brl(E.mensal) + " / mês"; const r = document.querySelector('[data-out="rateio"]'); if (r) r.textContent = brl(E.rateio); }
}
function updOuts(pac, C){
  const set = (k, t) => { const el = document.querySelector(`[data-out="${k}"]`); if (el) el.textContent = t; };
  set("tot-prep", hrs(C.horasPrep)); set("tot-esc", brl(C.equipe + C.ajudas)); set("tot-desp", brl(C.despesas));
  pac.atividades.forEach(a => set("at-" + a.id, hrs((a.qtd || 0) * (a.duracao || 0) * (a.prof || 0) * (a.rec === "mensal" ? (pac.duracaoMeses || 0) : 1)) + " de trabalho"));
  const catAj = Object.fromEntries((S.conta.empresa.ajudas || []).map(a => [a.id, a.valor || 0]));
  pac.escala.forEach(e => {
    const q = e.qtd || 0;
    const base = e.rem === "hora" ? q * (e.horas || 0) * (e.valor || 0) : e.rem === "diaria" ? q * (e.valor || 0) : q * (e.extra || 0);
    const aj = q * (e.ajudas || []).reduce((s, id) => s + (catAj[id] || 0), 0);
    set("es-" + e.id, `${brl(base + aj)} no evento`);
  });
}

/* ---------- eventos ---------- */
function touched(path){
  if (path.startsWith("conta.")) saveConta();
  if (path.startsWith("sim.")) saveDraft();
}
document.addEventListener("input", ev => {
  const el = ev.target, k = el.dataset && el.dataset.k;
  if (!k || el.tagName === "SELECT" || el.type === "checkbox") return;
  if (el.dataset.t === "num") {
    const n = parseNum(el.value);
    if (Number.isNaN(n)) return;
    setP(k, n);
    const box = el.closest(".inp"); if (box && box.classList.contains("req")) box.classList.toggle("empty", n == null);
  } else setP(k, el.value);
  touched(k); recalc();
});
document.addEventListener("change", ev => {
  const el = ev.target, k = el.dataset && el.dataset.k;
  if (!k) return;
  if (el.dataset.t === "ajuda") {
    const arr = getP(k) || []; const id = el.dataset.id;
    setP(k, el.checked ? [...new Set([...arr, id])] : arr.filter(x => x !== id));
  } else if (el.dataset.t === "pac") {
    const p = S.conta.pacotes.find(x => x.id === el.value);
    const keep = { id: S.sim.id, nome: S.sim.nome, desconto: S.sim.desconto, formaId: S.sim.formaId, meta: S.sim.meta };
    S.sim = { ...novaSim(p), ...keep };
  } else if (el.tagName === "SELECT") setP(k, el.value);
  else if (el.dataset.t === "num") { const n = parseNum(el.value); el.value = fmtIn(Number.isNaN(n) ? getP(k) : n); return; }
  else return;
  touched(k); keepAdj(); render();
});
function keepAdj(){ const d = $("#adj"); if (d) S.ui_adj = d.open; }
document.addEventListener("toggle", ev => { if (ev.target.id === "adj") S.ui_adj = ev.target.open; }, true);

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, path = b.dataset.path;
  keepAdj();
  if (a !== "ask") S.confirm = null;
  if (a === "tab") { S.view = b.dataset.v; window.scrollTo(0, 0); }
  else if (a === "ask") S.confirm = path;
  else if (a === "cancel") {}
  else if (a === "add") {
    const arr = getP(path); const kind = b.dataset.kind;
    arr.push(kind === "atividade" ? novaAtividade() : kind === "escala" ? novaEscala() : kind === "despesa" ? novaDespesa() : kind === "forma" ? { id: uid(), nome: "", taxa: null } : { id: uid(), nome: "", valor: null });
    touched(path);
  }
  else if (a === "del") {
    const ks = path.split("."), i = +ks.pop(), arr = getP(ks.join("."));
    const [rem] = arr.splice(i, 1);
    if (ks.join(".") === "conta.empresa.ajudas" && rem) { const strip = p => p.escala.forEach(e => e.ajudas = (e.ajudas || []).filter(x => x !== rem.id)); S.conta.pacotes.forEach(strip); strip(S.sim.pac); saveDraft(); }
    if (ks.join(".") === "conta.empresa.formas" && rem && S.sim.formaId === rem.id) S.sim.formaId = (S.conta.empresa.formas[0] || {}).id;
    touched(path);
  }
  else if (a === "newpac") { const p = pacoteVazio(`Pacote ${S.conta.pacotes.length + 1}`); S.conta.pacotes.push(p); S.pacIdx = S.conta.pacotes.length - 1; S.view = "pacotes"; saveConta(); }
  else if (a === "selpac") S.pacIdx = +b.dataset.i;
  else if (a === "duppac") { const p = clone(S.conta.pacotes[S.pacIdx]); p.id = uid(); p.nome = (p.nome || "Pacote") + " (cópia)"; [p.atividades, p.escala, p.despesas].forEach(l => l.forEach(x => x.id = uid())); S.conta.pacotes.splice(S.pacIdx + 1, 0, p); S.pacIdx++; saveConta(); }
  else if (a === "delpac") { S.conta.pacotes.splice(S.pacIdx, 1); S.pacIdx = 0; saveConta(); }
  else if (a === "simpac") { const p = S.conta.pacotes[S.pacIdx]; S.sim = novaSim(p); S.view = "simular"; saveDraft(); }
  else if (a === "pick") { S.sim = novaSim(S.conta.pacotes.find(x => x.id === b.dataset.id)); saveDraft(); }
  else if (a === "resetsim") { S.sim = novaSim(null); S.sim.pacoteId = null; saveDraft(); }
  else if (a === "savesim" || a === "saveasnew") {
    const s = S.sim;
    if (a === "saveasnew" || !s.id) { s.id = "s" + Date.now().toString(36) + uid().slice(0, 4); if (a === "saveasnew") s.nome = (s.nome || "Simulação") + " (nova)"; }
    if (!s.nome) s.nome = `${s.pacoteNome || "Simulação"} · ${new Date().toLocaleDateString("pt-BR")}`;
    s.atualizadoEm = new Date().toISOString();
    const R = calcSim(s, S.conta.empresa); s.resumo = R.ok ? { sobra: r2(R.sobra), margem: R.margem } : null;
    const i = S.sims.findIndex(x => x.id === s.id); const copy = clone(s);
    if (i >= 0) S.sims[i] = copy; else S.sims.push(copy);
    saveDraft(); render();
    const ok = await saveSimDoc(copy);
    const m = $("#savemsg"); if (m) m.textContent = ok ? (S.local ? "Salva neste aparelho." : "Salva na conta.") : "Não foi possível salvar. Tente de novo.";
    return;
  }
  else if (a === "opensim" || a === "dupsim") {
    const s = clone(S.sims.find(x => x.id === b.dataset.id));
    if (a === "dupsim") { s.id = "s" + Date.now().toString(36) + uid().slice(0, 4); s.nome = (s.nome || "Simulação") + " (cópia)"; s.atualizadoEm = new Date().toISOString(); S.sims.push(clone(s)); await saveSimDoc(s); }
    else { S.sim = s; S.view = "simular"; saveDraft(); }
  }
  else if (a === "delsim") { const id = b.dataset.id; S.sims = S.sims.filter(x => x.id !== id); if (S.sim.id === id) S.sim.id = null; await deleteSimDoc(id); }
  else if (a === "seed" && SEED) { S.conta = clone(SEED); S.pacIdx = 0; saveConta(); }
  render();
});

/* ---------- início ---------- */
$("#brandName").textContent = BRAND.nome; $("#brandSub").textContent = BRAND.sub;
(async () => {
  await initStore();
  if (S.sim && S.sim.pacoteId && !S.conta.pacotes.some(p => p.id === S.sim.pacoteId) && !S.sim.id) S.sim = novaSim(S.conta.pacotes[0]);
  if (MODE === "comercial" && S.conta.empresa.nome) $("#brandSub").textContent = S.conta.empresa.nome;
  render();
})();
</script>
